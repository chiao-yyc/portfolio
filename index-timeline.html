<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="楊雅喬 Grace Yang - 前端開發者，3.5年 Vue.js/Nuxt.js 實戰經驗">
    <meta name="author" content="Grace Yang">
    <title>Grace Yang | Timeline</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="style-timeline.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-900 text-gray-100 font-sans overflow-hidden">

    <!-- Top Bar -->
    <div class="fixed top-0 left-0 right-0 z-50 flex justify-between items-center px-6 py-4 bg-gray-900/80 backdrop-blur-md border-b border-gray-800">
        <div>
            <h1 class="text-xl font-bold">Grace Yang</h1>
            <p class="text-xs text-gray-400">Web Developer</p>
        </div>
        <div class="flex items-center gap-4">
            <button id="back-btn" class="hidden px-4 py-2 text-sm bg-gray-800 hover:bg-gray-700 rounded-lg transition-colors">
                ← 返回時間軸
            </button>
            <button id="theme-toggle" class="p-2 rounded-lg hover:bg-gray-800 transition-colors">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- Timeline View -->
    <div id="timeline-view" class="timeline-view">
        <div class="timeline-container">
            <div class="timeline-track">

                <!-- Hero Node -->
                <div class="timeline-node hero-node">
                    <div class="node-content">
                        <h2 class="text-5xl font-bold mb-4">楊雅喬</h2>
                        <p class="text-2xl text-gray-400 mb-2">Grace Yang</p>
                        <p class="text-lg text-gray-500">Web Developer</p>
                        <div class="mt-6 flex gap-4">
                            <span class="tag">Vue.js</span>
                            <span class="tag">TypeScript</span>
                            <span class="tag">D3.js</span>
                        </div>
                    </div>
                </div>

                <!-- 2024 Node -->
                <div class="timeline-node clickable" data-period="2024">
                    <div class="node-dot"></div>
                    <div class="node-label">
                        <div class="text-3xl font-bold text-blue-400">2024</div>
                        <p class="text-sm text-gray-400 mt-1">離職 · Side Projects</p>
                    </div>
                </div>

                <!-- 2020-2023 Node -->
                <div class="timeline-node clickable" data-period="2020-2023">
                    <div class="node-dot"></div>
                    <div class="node-label">
                        <div class="text-3xl font-bold text-blue-400">2020-2023</div>
                        <p class="text-sm text-gray-400 mt-1">台灣知識庫</p>
                        <p class="text-xs text-gray-500 mt-1">資深前端工程師</p>
                    </div>
                </div>

                <!-- 2019 Node -->
                <div class="timeline-node clickable" data-period="2019">
                    <div class="node-dot"></div>
                    <div class="node-label">
                        <div class="text-3xl font-bold text-blue-400">2019</div>
                        <p class="text-sm text-gray-400 mt-1">竹冶聯合設計</p>
                        <p class="text-xs text-gray-500 mt-1">專案企劃</p>
                    </div>
                </div>

                <!-- 2017-2018 Node -->
                <div class="timeline-node clickable" data-period="2017-2018">
                    <div class="node-dot"></div>
                    <div class="node-label">
                        <div class="text-3xl font-bold text-blue-400">2017-2018</div>
                        <p class="text-sm text-gray-400 mt-1">澳洲工作經驗</p>
                        <p class="text-xs text-gray-500 mt-1">Supervisor</p>
                    </div>
                </div>

                <!-- Contact Node -->
                <div class="timeline-node contact-node">
                    <div class="node-content">
                        <h3 class="text-2xl font-bold mb-4 text-blue-400">Get in Touch</h3>
                        <div class="space-y-3">
                            <a href="mailto:chiaoyyc@gmail.com" class="contact-link">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"></path>
                                    <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"></path>
                                </svg>
                                <span>Email</span>
                            </a>
                            <a href="https://github.com/chiaoyyc" target="_blank" class="contact-link">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                                </svg>
                                <span>GitHub</span>
                            </a>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <div class="scroll-hint">
            <p>← 水平滾動探索職涯歷程 →</p>
        </div>
    </div>

    <!-- Detail View -->
    <div id="detail-view" class="detail-view hidden">
        <div class="detail-content"></div>
    </div>

    <script src="script-timeline.js"></script>
</body>
</html>
